[package]
name = "lyrics-art"
version = "1.1.0"
edition = "2021"
description = "AuraHiFi sandboxed Extism Wasm add-on for LRCLIB lyrics and Cover Art Archive artwork."
authors = ["AuraHiFi First-Party"]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
