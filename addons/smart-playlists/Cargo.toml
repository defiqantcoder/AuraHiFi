[package]
name = "smart-playlists"
version = "1.0.4"
edition = "2021"
description = "AuraHiFi sandboxed Extism Wasm add-on for Online Gemini Structured Outputs and Offline Bliss + CLAP + sqlite-vec smart playlist generation."
authors = ["AuraHiFi First-Party"]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
