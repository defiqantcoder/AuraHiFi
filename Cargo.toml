[workspace]
members = [
    "src-tauri",
]
exclude = [
    "addons",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# --- Development Profile ---
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

# --- Test Profile ---
[profile.test]
debug = 1
split-debuginfo = "unpacked"

# --- Strip Debug Symbols from 3rd-Party Dependencies ---
[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test.package."*"]
opt-level = 2
debug = 0
