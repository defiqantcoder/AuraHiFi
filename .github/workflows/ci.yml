name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit matrix across Ubuntu 24.04 LTS (Noble) and Ubuntu 26.04 LTS (Resolute)
        # Avoid generic 'ubuntu-latest' which switched to 26.04
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js 24 LTS
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Ubuntu native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libasound2-dev \
            libudev-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend assets
        run: npm run build

      - name: Lint DESIGN.md tokens
        run: npx @google/design.md lint DESIGN.md

      - name: Rust formatting check
        run: cargo fmt --all --check

      - name: Rust Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build first-party Wasm add-ons
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path addons/Cargo.toml

      - name: Install cargo-nextest (if not present)
        run: |
          if ! command -v cargo-nextest &> /dev/null; then
            curl -LsSf https://get.nexte.st/latest/linux | tar -xz -C ~/.cargo/bin
          fi

      - name: Run test suite via cargo-nextest
        run: cargo nextest run --release --workspace

      - name: Run doc tests
        run: cargo test --doc --workspace
